<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toro Transformation · Pedro Holanda</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#070A0F;--bar:rgba(11,15,23,.92);--surface:rgba(15,23,42,.8);--card:#131B2E;--deep:#020617;--ink:#E2E8F0;--soft:#CBD5E1;--white:#FFFFFF;--muted:#94A3B8;--muted2:#64748B;--line:#1E293B;--line2:#334155;
--gold:#F59E0B;--gold2:#FBBF24;--gold3:#D97706;--gold-ink:#020617;--gold-soft:rgba(245,158,11,.1);--gold-line:rgba(245,158,11,.35);
--red:#FB7185;--red-soft:rgba(244,63,94,.12);--green:#34D399;--green-soft:rgba(16,185,129,.15);--field:#020617;
--sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--glow:0 0 25px rgba(245,158,11,.12);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"],:root[data-theme="light"]{color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
img,video{max-width:100%}
h1,h2,h3{margin:0;line-height:1.2;color:var(--white);font-weight:800;letter-spacing:-.01em}
h2{font-size:18px}
h3{font-size:16px;font-weight:700}
p{margin:0}
a{color:inherit}
b.w{color:var(--white)}
.gold{color:var(--gold2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:11px}
.stack>*+*{margin-top:12px}
.stack-lg>*+*{margin-top:24px}
.gtxt{background:linear-gradient(135deg,#FFF 30%,#F59E0B 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--gold)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bar);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid rgba(30,41,59,.8)}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
.logo{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;cursor:pointer;text-align:left;min-width:0}
.ph{width:40px;height:40px;border-radius:12px;background:linear-gradient(45deg,#D97706,#FBBF24);display:grid;place-items:center;font-weight:800;color:var(--gold-ink);font-size:18px;box-shadow:0 8px 20px rgba(245,158,11,.2);flex:none}
.logo b{display:block;font-weight:800;font-size:17px;color:var(--white);letter-spacing:-.01em;line-height:1.1;white-space:nowrap}
.logo b em{font-style:normal;color:var(--gold)}
.logo small{display:block;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.hr{display:flex;align-items:center;gap:10px}
.streak{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:10px;background:#0F172A;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--gold2);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#10B981;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}
.seg{display:inline-flex;background:rgba(15,23,42,.9);border:1px solid var(--line);border-radius:12px;padding:5px;gap:2px;flex:none}
.seg button{border:0;background:none;color:var(--muted);font-weight:600;font-size:12px;padding:8px 14px;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--white)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);font-weight:700;box-shadow:0 4px 12px rgba(245,158,11,.2)}
.langbtn{padding:8px 10px;border-radius:10px;background:#0F172A;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--soft);cursor:pointer}
.langbtn span{color:var(--gold)}
.show-sm{display:none}
@media (max-width:767px){.hide-sm{display:none}.show-sm{display:inline}.seg button{padding:8px 6px}.logo b{font-size:15px}.top-in{flex-wrap:wrap}.seg{width:100%}.seg button{flex:1}}

.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 112px}
.wrap.wide{padding-bottom:56px}
.narrow{max-width:780px;margin-left:auto;margin-right:auto}
@media (min-width:768px){.wrap{padding:28px 24px 112px}}
@media (min-width:1024px){.wrap{padding:32px 32px 112px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line2);background:#1E293B;color:var(--white);padding:11px 16px;font-weight:700;font-size:13px;cursor:pointer;text-decoration:none;min-height:44px;transition:opacity .2s,border-color .2s}
.btn:hover{background:#334155}
.btn.gold{background:linear-gradient(90deg,#F59E0B,#D97706);border-color:transparent;color:var(--gold-ink);font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:12px;box-shadow:0 8px 20px rgba(245,158,11,.2)}
.btn.gold:hover{opacity:.93}
.btn.line{background:#0F172A;color:var(--white);border-color:var(--line)}
.btn.line:hover{border-color:var(--line2)}
.btn.danger{background:transparent;color:var(--red);border-color:rgba(251,113,133,.4)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:12px}
.btn.block{width:100%}
.linkbtn{border:0;background:none;padding:0;color:var(--gold2);font-weight:700;cursor:pointer;text-decoration:none}
.linkbtn:hover{text-decoration:underline}

.pill{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border-radius:999px;background:var(--gold-soft);border:1px solid rgba(245,158,11,.3);color:var(--gold2);font-size:12px;font-weight:600}
.hero{position:relative;overflow:hidden;border-radius:24px;border:1px solid var(--line);background:linear-gradient(90deg,#0F172A,#131B2E,#0F172A);padding:26px;box-shadow:var(--glow)}
.hero::after{content:"";position:absolute;right:-40px;bottom:-40px;width:256px;height:256px;border-radius:50%;background:rgba(245,158,11,.1);filter:blur(60px);pointer-events:none}
.hero-in{position:relative;z-index:1;display:flex;flex-direction:column;gap:24px}
@media (min-width:1024px){.hero{padding:32px}.hero-in{flex-direction:row;align-items:center;justify-content:space-between}}
.h-hero{font-size:clamp(26px,5vw,38px);font-weight:800;letter-spacing:-.02em}
.widget{background:rgba(2,6,23,.8);border:1px solid rgba(30,41,59,.8);border-radius:16px;padding:20px;min-width:280px}
.widget>*+*{margin-top:12px}
.main-grid{display:grid;gap:24px;grid-template-columns:1fr}
@media (min-width:1024px){.main-grid{grid-template-columns:2fr 1fr}}
.gt-h{display:flex;align-items:center;gap:12px}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none}
.ico.s{width:32px;height:32px;border-radius:9px;font-size:15px}
.i-gold{background:rgba(245,158,11,.2);color:var(--gold2)}
.i-espiritual{background:rgba(99,102,241,.2)}.i-saude{background:rgba(16,185,129,.2)}.i-emocional{background:rgba(244,63,94,.2)}.i-relacional{background:rgba(14,165,233,.2)}.i-intelectual{background:rgba(245,158,11,.2)}
.shift{display:flex;background:var(--deep);padding:4px;border-radius:12px;border:1px solid var(--line);font-size:12px}
.shift button{border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:9px;cursor:pointer;font-weight:600}
.shift button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);font-weight:700}
.vbox{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(ellipse at 30% 20%,rgba(245,158,11,.18),transparent 60%),linear-gradient(160deg,#131B2E,#020617);display:grid;place-items:center}
.vbox .play{width:64px;height:64px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;box-shadow:0 10px 30px rgba(245,158,11,.3);opacity:.55}
.vbox .cap{position:absolute;left:16px;right:16px;bottom:14px;display:flex;justify-content:space-between;font-size:12px;color:var(--soft)}
.vid{width:100%;border-radius:12px;background:#000;display:block;aspect-ratio:16/9;border:1px solid var(--line)}
.voice{color:var(--soft);font-size:15px;line-height:1.75}
.voice p+p{margin-top:.8em}
.golden{border-color:rgba(245,158,11,.5);box-shadow:var(--glow)}
.task{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:12px;background:var(--deep);border:1px solid var(--line);width:100%;text-align:left;cursor:pointer;margin-top:10px;transition:border-color .2s}
.task:hover{border-color:var(--line2)}
.task[aria-checked="true"]{border-color:var(--gold-line)}
.task .tl{display:flex;align-items:center;gap:12px;min-width:0}
.task .an{display:block;font-weight:700;font-size:13px;color:var(--white)}
.task .tt{display:block;color:var(--muted);font-size:12px}
.box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line2);display:grid;place-items:center;flex:none;background:#0F172A}
.task[aria-checked="true"] .box{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.counter{font-size:12px;background:#1E293B;padding:4px 10px;border-radius:999px;color:var(--gold2);font-weight:700;white-space:nowrap}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--deep);cursor:pointer;margin-top:8px;font-size:13px;color:var(--soft)}
.opt:hover{border-color:rgba(245,158,11,.5);background:var(--gold-soft);color:var(--white)}
.note{padding:12px 14px;border-radius:12px;font-size:13px}
.note.warn{background:var(--red-soft);color:var(--ink);border:1px solid rgba(251,113,133,.3)}
.note.ok{background:var(--gold-soft);border:1px solid rgba(245,158,11,.3)}
.rescue{background:var(--red-soft);border:1px solid rgba(251,113,133,.4);border-radius:16px;padding:18px}
.rescue strong{display:block;font-weight:800;font-size:20px;color:var(--white);margin-bottom:6px}
.star{width:110px;height:110px;color:var(--gold);display:block;margin:0 auto;filter:drop-shadow(0 0 24px rgba(245,158,11,.35))}
.pop{animation:pop .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.2) rotate(-40deg);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.pop,.dot{animation:none}}
.dayno{font-weight:800;font-size:clamp(56px,14vw,88px);line-height:.95;letter-spacing:-.03em;color:var(--white)}

.trail{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:640px){.trail{grid-template-columns:1fr 1fr}}
@media (min-width:1024px){.trail{grid-template-columns:repeat(4,1fr)}}
.stage{position:relative;overflow:hidden;background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:16px}
.stage .st{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:#1E293B;color:var(--muted)}
.stage .sd{color:var(--gold);font-weight:800;font-size:14px;margin-bottom:4px}
.stage h4{margin:0 0 8px;color:var(--white);font-size:13px;font-weight:700}
.stage p{font-size:12px;color:var(--muted);margin-bottom:10px}
.stage .sf{font-size:11px;font-weight:600;color:var(--muted2)}
.stage.done{border-color:rgba(16,185,129,.4)}.stage.done .st{background:var(--green-soft);color:var(--green)}.stage.done .sf{color:var(--green)}
.stage.cur{border-color:rgba(245,158,11,.6);box-shadow:var(--glow)}.stage.cur .st,.stage.bonus .st{background:rgba(245,158,11,.2);color:var(--gold2)}.stage.cur .sf,.stage.bonus .sf{color:var(--gold2)}
.stage.lock{opacity:.8}.stage.lock .sd{color:var(--muted2)}
.stage.bonus{border-color:rgba(245,158,11,.3)}

.grid90{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.cell{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);font-size:11px;display:grid;place-items:center;color:var(--muted2);background:var(--deep);padding:0;font-variant-numeric:tabular-nums}
button.cell{cursor:pointer}
.cell.done{background:linear-gradient(135deg,#FBBF24,#D97706);border-color:transparent;color:var(--gold-ink);font-weight:700}
.cell.now{border:2px solid var(--gold);color:var(--gold2);font-weight:800}
.cell.has{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.3);color:var(--white)}
.cell.vid{box-shadow:inset 0 -3px 0 var(--gold)}
.cell.sel{outline:2px solid var(--white);outline-offset:1px}
.stats,.kpis{display:grid;gap:16px}
.stats{grid-template-columns:repeat(3,1fr)}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:20px}
.stats>div,.kpis>div{display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.stats b,.kpis b{display:block;font-weight:800;font-size:26px;line-height:1.1;color:var(--white)}
.kpis>div.hl b{color:var(--gold2)}
.stats span,.kpis span{font-size:12px;color:var(--muted)}
.levels{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.levels li{display:flex;align-items:center;gap:12px;font-size:14px}
.levels i{font-style:normal;width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;color:var(--muted)}
.levels li.on i{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.levels li.cur{font-weight:700;color:var(--gold2)}
.bar{height:10px;border-radius:99px;background:#1E293B;overflow:hidden}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,#D97706,#FBBF24);border-radius:99px}

.prod{padding:16px 0;border-top:1px solid var(--line)}
.prod:first-child{border-top:0;padding-top:4px}
.prod .pn{font-weight:700;font-size:16px;color:var(--white)}
.price{font-weight:800;font-size:22px;color:var(--gold2)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:#1E293B;color:var(--muted)}
.tag.gold{background:var(--gold-soft);border:1px solid rgba(245,158,11,.2);color:var(--gold2)}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.green{background:var(--green-soft);color:var(--green)}
.badge{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.badge:first-child{border-top:0}
.medal{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;border:2px dashed var(--line2);color:var(--muted2);font-weight:800}
.badge.on .medal{border:0;background:linear-gradient(135deg,#FBBF24,#D97706);color:var(--gold-ink);box-shadow:var(--glow)}
.badge b{color:var(--white)}
.code{font-weight:800;font-size:26px;letter-spacing:.04em;color:var(--gold2)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--bar);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.nav svg{width:21px;height:21px}
.nav button[aria-current="page"]{color:var(--gold)}

.atabs{display:flex;gap:4px;overflow-x:auto;margin:0 0 24px;scrollbar-width:none;background:rgba(15,23,42,.9);border:1px solid var(--line);border-radius:12px;padding:5px;width:max-content;max-width:100%}
.atabs button{border:0;background:none;padding:8px 14px;font-weight:600;font-size:12px;color:var(--muted);cursor:pointer;border-radius:9px;white-space:nowrap}
.atabs button[aria-current="page"]{background:var(--gold);color:var(--gold-ink);font-weight:700}
.cols{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:8px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;min-width:720px}
th,td{text-align:left;padding:13px 14px;white-space:nowrap}
td{border-top:1px solid rgba(30,41,59,.6);color:var(--soft)}
thead th{background:var(--deep);color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
thead th:first-child{border-radius:12px 0 0 12px}thead th:last-child{border-radius:0 12px 12px 0}
tbody tr:first-child td{border-top:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:rgba(2,6,23,.5)}
td b{color:var(--white)}
.who{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--white)}
.who img{width:28px;height:28px;border-radius:50%}
.list>div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.list>div:first-child{border-top:0}
label.f{display:block;font-weight:600;font-size:13px;color:var(--soft)}
label.f>input,label.f>textarea,label.f>select,.inp{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--white);font-weight:400;font-size:14px}
label.f>input:focus,label.f>textarea:focus,label.f>select:focus,.inp:focus{outline:none;border-color:var(--gold)}
::placeholder{color:var(--muted2)}
textarea{min-height:110px;resize:vertical;line-height:1.5}
fieldset{border:1px solid var(--line);border-radius:16px;padding:18px;margin:0;background:var(--surface)}
fieldset>*+*{margin-top:12px}
legend{font-weight:800;padding:0 8px;color:var(--white)}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.chk{display:flex;align-items:center;gap:10px;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--gold)}
.range{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.range b{color:var(--white)}
.range input{grid-column:1/-1;width:100%;accent-color:var(--gold)}
.range output{font-weight:800;font-size:22px;color:var(--gold2)}
.toast{position:fixed;right:24px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--gold);color:var(--gold-ink);font-weight:700;padding:12px 16px;border-radius:12px;font-size:13px;z-index:20;max-width:calc(100% - 48px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.banner{background:var(--gold-soft);border-bottom:1px solid rgba(245,158,11,.2);color:var(--gold2);padding:8px 16px;font-size:12px;text-align:center;font-weight:600}
.display{font-weight:800;font-size:clamp(40px,9vw,64px);line-height:1;letter-spacing:-.03em;color:var(--white)}
.empty{text-align:center;padding:32px 16px}

/* Site */
.site-hero{display:grid;gap:32px;align-items:center;grid-template-columns:1fr;padding-top:8px}
@media (min-width:1024px){.site-hero{grid-template-columns:1fr 1fr}}
.site-hero>div:first-child>*+*{margin-top:22px}
.h-site{font-size:clamp(40px,8vw,64px);font-weight:800;line-height:1.05;letter-spacing:-.02em}
.lead{color:var(--soft);font-size:16px;line-height:1.7}
.quote{padding:16px;border-radius:12px;background:#0F172A;border-left:4px solid var(--gold);font-size:13px;color:var(--muted);font-style:italic;margin:0}
.photo{position:relative;width:100%;max-width:448px;aspect-ratio:1;margin:0 auto;border-radius:24px;padding:8px;border:1px solid var(--line);background:linear-gradient(45deg,rgba(217,119,6,.3),#0F172A);box-shadow:var(--glow)}
.photo .in{width:100%;height:100%;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#1E293B,#020617);display:grid;place-items:center}
.photo .in img{width:100%;height:100%;object-fit:cover}
.photo .mono{font-size:120px;font-weight:800;letter-spacing:-.04em;opacity:.9}

@media (min-width:1024px){
 .side{display:block;position:sticky;top:84px;align-self:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px}
 .mnav{display:none!important}
}
.side p{font-size:11px;color:var(--muted2);font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:10px 12px 6px}
.side button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;background:none;color:var(--muted);padding:10px 12px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;text-align:left}
.side button:hover{color:var(--white);background:rgba(30,41,59,.55)}
.side button[aria-current="page"]{background:var(--gold);color:var(--gold-ink);font-weight:700}
.nb{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:#E11D48;color:#fff;font-size:11px;display:inline-grid;place-items:center;font-weight:700;margin-left:6px}
.side button[aria-current="page"] .nb,.atabs button[aria-current="page"] .nb{background:var(--gold-ink);color:var(--gold2)}
.stickynav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:8;background:var(--bg);padding:10px 0 4px;margin-top:-10px}

.atabs{margin:0}
.userchip{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--soft)}
.userchip .av{width:34px;height:34px;border-radius:10px;background:#1E293B;border:1px solid var(--line2);display:grid;place-items:center;font-weight:800;color:var(--gold2);font-size:13px;flex:none}
.userchip b{display:block;color:var(--white);font-size:13px;line-height:1.2}
.impbar{background:linear-gradient(90deg,#D97706,#F59E0B);color:var(--gold-ink);font-weight:700;font-size:13px;padding:9px 16px;display:flex;justify-content:center;gap:14px;align-items:center;flex-wrap:wrap}
.impbar button{background:var(--gold-ink);color:var(--gold2);border:0;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer;font-size:12px}

/* Login */
.login{min-height:calc(100vh - 90px);display:grid;place-items:center;padding:28px 16px 48px}
.lgrid{width:100%;max-width:1040px;display:grid;gap:28px;grid-template-columns:1fr;align-items:center}
@media (min-width:960px){.lgrid{grid-template-columns:1.1fr 1fr}}
.lbox{width:100%;max-width:460px;justify-self:center}
.ltabs{display:grid;grid-template-columns:1fr 1fr;background:rgba(15,23,42,.9);border:1px solid var(--line);border-radius:12px;padding:5px;gap:4px}
.ltabs button{border:0;background:none;color:var(--muted);font-weight:600;font-size:13px;padding:10px;border-radius:9px;cursor:pointer}
.ltabs button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);font-weight:700}
.creds{font-size:12px;color:var(--muted);background:var(--deep);border:1px dashed var(--line2);border-radius:12px;padding:12px 14px;line-height:1.7}
.creds code{color:var(--gold2);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.creds button{background:none;border:0;padding:0;color:var(--gold2);font-weight:700;cursor:pointer;font-size:12px}
.err{color:var(--red);font-size:13px;font-weight:600}

.tbox>*+*{margin-top:12px}
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tbar .inp{width:auto;flex:1 1 200px;max-width:340px;margin:0}
.tbar select.inp{flex:0 1 auto;max-width:220px;padding:9px 10px}
.grow{flex:1 1 0}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.pager .pg{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.pager button{min-width:32px;height:32px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:#0F172A;color:var(--soft);cursor:pointer;font-weight:600;font-size:12px}
.pager button[aria-current="page"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.pager button:disabled{opacity:.35;cursor:default}
.pager select{padding:6px 8px;border-radius:8px;background:var(--field);border:1px solid var(--line);color:var(--white);font-size:12px}
button.th{background:none;border:0;padding:0;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;white-space:nowrap}

.sub{display:block;font-size:11px;color:var(--muted2);font-weight:500}

/* Modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(2,6,23,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow:auto}
.mbox{width:100%;max-width:620px;background:#0F172A;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 30px 60px rgba(0,0,0,.5);margin:auto 0}
.mbox.wide{max-width:860px}
.x{border:0;background:#1E293B;color:var(--soft);width:34px;height:34px;border-radius:10px;font-size:18px;cursor:pointer;line-height:1;flex:none}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#0F172A;color:var(--muted);padding:7px 12px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold-soft);border-color:rgba(245,158,11,.45);color:var(--gold2)}
.shop{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}

.pimg img{width:100%;height:100%;object-fit:cover}

.pbody .grow{flex:1}

.walker.moving .l1,.walker.moving .a2{animation:swing .32s ease-in-out infinite alternate}
.walker.moving .l2,.walker.moving .a1{animation:swing .32s ease-in-out infinite alternate-reverse}
.walker.idle .body{animation:breathe 2.4s ease-in-out infinite}

function sha256js(ascii){ascii=unescape(encodeURIComponent(ascii));function rr(v,a){return(v>>>a)|(v<<(32-a))}const mp=Math.pow,mw=mp(2,32);let i,j,result="";const words=[],bl=ascii.length*8;let hash=[];const k=[];let pc=0;const comp={};

 for(j=0;j<words.length;){const w=words.slice(j,j+=16);const old=hash;hash=hash.slice(0,8);

   const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
   hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}
  for(i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0}

function genBase(products,cfg){
 const R=rng(20260924),t=today(),pick=a=>a[Math.floor(R()*a.length)],ri=(a,b)=>a+Math.floor(R()*(b-a+1));
 const ufPick=()=>{let x=R()*UFS.reduce((s,u)=>s+u[2],0);for(const u of UFS){x-=u[2];if(x<=0)return u}return UFS[0]};

 const students=[],orders=[],tickets=[],chats=[];let oseq=1;

   baseline:Object.fromEntries(AREAS.map(a=>[a.k,ri(2,8)])),doneDates:[],today:null,journeyStart:null,affiliate:{status:"none"},sponsorId:"",
   address:{cep:`${ri(10,99)}${ri(100,999)}-${ri(100,999)}`,rua:"Rua "+pick(LN),numero:String(ri(10,2500)),bairro:"Centro",cidade:u[1],uf:u[0]}};
  if(target>=0){
   let cur=addDays(t,-gap);const dd=[];
   for(let k=0;k<target;k++){dd.unshift(cur);cur=addDays(cur,-1-(R()<.1?ri(1,2):0))}
   s.doneDates=dd;s.journeyStart=dd.length?addDays(dd[0],-(R()<.3?1:0)):addDays(t,-ri(0,4));
   s.createdAt=addDays(s.journeyStart,-ri(0,6))+"T"+pad(ri(7,22),2)+":"+pad(ri(0,59),2)+":00";
   const last=dd[dd.length-1];
   if(target<90&&last!==t&&gap<=1&&R()<.45){const tk={};ITEMS.forEach(x=>tk[x]=R()<.55);tk.golden=R()<.6;if(ITEMS.every(x=>tk[x]))tk.intelectual=false;s.today={date:t,tasks:tk}}
   if(target>=cfg.affiliateDays){const q=R();const d21=dd[cfg.affiliateDays-1];
    if(i<=8||q<.45)s.affiliate={status:"aprovado",requestedAt:d21,approvedAt:addDays(d21,ri(0,3))};

 }
 // rede de indicação
 const byCreated=[...students].sort((a,b)=>a.createdAt<b.createdAt?-1:1);
 const affs=students.filter(s=>s.affiliate.status==="aprovado");
 byCreated.forEach(s=>{if(R()<.62){const pool=affs.filter(a=>a.id!==s.id&&a.affiliate.approvedAt<=s.createdAt.slice(0,10));if(pool.length){const w=pool.slice(-40);s.sponsorId=pick(R()<.7?w:pool).id}}});
 // pedidos
 const mkItem=(p)=>{const v=(p.variants||"").split(",").map(x=>x.trim()).filter(Boolean);const q=p.category==="suplemento"&&R()<.3?2:1;return{productId:p.id,name:p.name,category:p.category,qty:q,price:+p.price||0,cost:+p.cost||0,variant:v.length?pick(v):""}};

 const mkOrder=(s,date,items,status)=>{const sub=items.reduce((a,x)=>a+x.price*x.qty,0),hasP=items.some(x=>PHYS.has(x.category));const fr=hasP&&sub<cfg.freeFreightOver?cfg.freight:0;
  const o={id:"o"+pad(oseq++,5),studentId:s.id,items,subtotal:sub,freight:fr,total:sub+fr,status,createdAt:date+"T"+pad(ri(6,23),2)+":"+pad(ri(0,59),2)+":00",paidAt:PAID.has(status)?date:"",tracking:hasP&&(status==="enviado"||status==="entregue")?"BR"+ri(100000000,999999999)+"BR":"",source:"teste",test:true};
  orders.push(o);return o};
 students.forEach(s=>{
  if(s.journeyStart&&game){const st=R()<.03?"reembolsado":"pago";mkOrder(s,s.journeyStart,[mkItem(game)],st);if(st==="reembolsado"){s.journeyStart=null;s.doneDates=[];s.today=null;s.affiliate={status:"none"}}}

  if(s.journeyStart){const n=R()<.45?0:R()<.55?1:R()<.7?2:3;const span=Math.max(1,diffDays(s.journeyStart,t));

    const st=usePhys?physSt(d):(R()<.04?"pendente":R()<.03?"reembolsado":"pago");mkOrder(s,d,items,st)}}
 });
 // tickets
 const buyers=students.filter(s=>s.journeyStart);
 for(let k=1;k<=84;k++){const s=pick(buyers),cat=pick(Object.keys(TICKET_CAT)),d=addDays(t,-ri(0,40)),stt=pick(["aberto","aberto","andamento","aguardando","resolvido","resolvido","fechado"]);

  if(stt!=="aberto")msgs.push({f:"s",by:"Equipe Toro",t:"Olá! Já estamos verificando e retornamos em breve.",at:d+"T11:"+pad(ri(10,59),2)+":00"});
  if(stt==="resolvido"||stt==="fechado")msgs.push({f:"s",by:"Equipe Toro",t:"Resolvido. Qualquer coisa, é só responder aqui.",at:addDays(d,1)+"T10:00:00"});

  chats.push({id:s.id,studentId:s.id,messages:m,unreadAdmin:answered?0:1,unreadStudent:0,updatedAt:m[m.length-1].at,test:true})}
 return{students,orders,tickets,chats};
}

function stats(me){
 const dd=(me&&me.doneDates)||[];const t=today();
 const count=Math.min(90,dd.length),last=dd[dd.length-1],doneToday=last===t;
 const currentDay=Math.min(90,doneToday?count:count+1);
 const set=new Set(dd);let streak=0,cur=doneToday?t:addDays(t,-1);while(set.has(cur)){streak++;cur=addDays(cur,-1)}
 const started=!!(me&&me.journeyStart);
 const ref=last||(me&&me.journeyStart)||t;const gap=started?Math.max(0,diffDays(ref,t)-(last?1:0)):0;
 const tk=me&&me.today&&me.today.date===t?(me.today.tasks||{}):{};
 const pctToday=doneToday?100:Math.round(ITEMS.filter(k=>tk[k]).length/ITEMS.length*100);
 const lastActive=[last,me&&me.today&&me.today.date].filter(Boolean).sort().pop()||"";
 const phase=!started?"sem":count>=90?"fim":count>=60?"final":count>=21?"meio":"inicio";
 return{count,currentDay,doneToday,streak,gap,pct:pctToday,lastActive,level:levelOf(count),started,phase,
  atRisk:started&&gap>=3&&!doneToday&&count<90,activeToday:lastActive===t}}
const PHASE={sem:"Sem jornada",inicio:"Início (0–20)",meio:"Meio (21–59)",final:"Fase final (60–89)",fim:"Concluiu 90 dias"};

const TS={},TB={},FL={};

 const pages=Math.max(1,Math.ceil(r.length/st.size));if(st.page>pages)st.page=pages;

 ${pager(k,st,r.length,pages,from,sl.length)}</div>`}
function pager(k,st,n,pages,from,len){

 const top=H-M-74,per=Math.max(1,Math.floor((top-M-10)/rh)-1);const pages=[];for(let i=0;i<Math.max(1,body.length);i+=per)pages.push(body.slice(i,i+per));

 const streams=pages.map((rows,pi)=>{let s=`0.96 0.62 0.04 rg ${M} ${H-M-6} 46 5 re f\n`;
  s+=`BT /F2 15 Tf 0.06 0.09 0.16 rg ${M} ${H-M-26} Td (${enc(title)}) Tj ET\n`;
  s+=`BT /F1 8.5 Tf 0.35 0.4 0.47 rg ${M} ${H-M-40} Td (${enc(sub)}) Tj ET\n`;
  s+=`BT /F1 8 Tf 0.35 0.4 0.47 rg ${M} ${H-M-52} Td (${enc(`${body.length} registro(s) - Toro Transformation - Pedro Holanda`)}) Tj ET\n`;
  let y=top;s+=`0.06 0.09 0.16 rg ${M} ${y-4} ${avail} ${rh} re f\n`;let x=M;
  head.forEach((h,i)=>{s+=`BT /F2 ${fs} Tf 1 1 1 rg ${(x+4).toFixed(1)} ${y+1} Td (${enc(fit(h,cw[i]-6))}) Tj ET\n`;x+=cw[i]});

 const objs=[];objs[1]="<< /Type /Catalog /Pages 2 0 R >>";
 objs[2]=`<< /Type /Pages /Kids [${streams.map((_,i)=>(5+i*2)+" 0 R").join(" ")}] /Count ${streams.length} >>`;

 let out="%PDF-1.4\n%\xE2\xE3\xCF\xD3\n";const off=[];
 for(let i=1;i<objs.length;i++){off[i]=out.length;out+=`${i} 0 obj\n${objs[i]}\nendobj\n`}
 const xr=out.length;out+=`xref\n0 ${objs.length}\n0000000000 65535 f \n`+off.slice(1).map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("");
 out+=`trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;

function bump(){S.ver++}

function ensureGen(){
 const key=today()+"|"+S.db.products.map(p=>p.id+p.price+p.active+p.variants).join(",");
 if(S.genKey!==key&&S.db.products.length){S.gen=genBase(S.db.products,S.config);S.genKey=key;bump()}}
function mergeById(gen,real){const m=new Map();(gen||[]).forEach(x=>m.set(x.id,x));(real||[]).forEach(x=>m.set(x.id,{...(m.get(x.id)||{}),...x}));return[...m.values()]}

/* Tudo o que o BI, financeiro e escritórios precisam, recalculado só quando os dados mudam */
function model(){
 if(S.Mver===S.ver&&S.M)return S.M;
 ensureGen();
 const showT=S.config.showTestBase!==false,g=showT&&S.gen?S.gen:{students:[],orders:[],tickets:[],chats:[]};
 const vis=x=>showT||!x.test;
 const students=mergeById(g.students,S.db.alunos).filter(vis);
 const byId=new Map(students.map(s=>[s.id,s]));
 const orders=mergeById(g.orders,S.db.orders).filter(o=>vis(o)&&byId.has(o.studentId));
 const tickets=mergeById(g.tickets,S.db.tickets).filter(t=>vis(t)&&byId.has(t.studentId));
 const chats=mergeById(g.chats,S.db.chats).filter(c=>vis(c)&&byId.has(c.studentId||c.id));
 const st=new Map(students.map(s=>[s.id,stats(s)]));
 // compras por aluno
 const buy=new Map();students.forEach(s=>buy.set(s.id,{game:false,prod:false,spent:0,orders:0}));
 orders.forEach(o=>{if(!PAID.has(o.status))return;const b=buy.get(o.studentId);if(!b)return;b.orders++;b.spent+=+o.total||0;
  o.items.forEach(it=>{if(it.category==="programa")b.game=true;else if(it.category!=="bonus")b.prod=true})});
 students.forEach(s=>{if(s.journeyStart)buy.get(s.id).game=true});
 const seg=s=>{const b=buy.get(s.id);return b.game&&b.prod?"ambos":b.game?"game":b.prod?"produtos":"cadastro"};
 // rede e comissões
 const lv=S.config.levels||DEF_LEVELS,prodById=new Map(S.db.products.map(p=>[p.id,p]));
 const children=new Map();students.forEach(s=>{if(s.sponsorId&&byId.has(s.sponsorId)){if(!children.has(s.sponsorId))children.set(s.sponsorId,[]);children.get(s.sponsorId).push(s.id)}});
 const ledger=[];const aff=new Map();
 const A=id=>{if(!aff.has(id))aff.set(id,{direct:0,network:0,sales:0,salesN:0,earned:0,byLevel:{}});return aff.get(id)};
 orders.forEach(o=>{if(!PAID.has(o.status))return;const buyer=byId.get(o.studentId);if(!buyer)return;
  const base=o.items.reduce((a,it)=>{const p=prodById.get(it.productId);const com=p?p.commissionable!==false:it.category!=="bonus";return a+(com?it.price*it.qty:0)},0);if(base<=0)return;
  let cur=buyer.sponsorId,level=1;const seen=new Set();
  while(cur&&level<=100&&!seen.has(cur)){seen.add(cur);const up=byId.get(cur);if(!up)break;const p=+lv[level-1]||0;
   if(up.affiliate&&up.affiliate.status==="aprovado"&&p>0){const v=Math.round(base*p)/100;ledger.push({id:o.id+"-"+level,date:(o.paidAt||o.createdAt||"").slice(0,10),orderId:o.id,buyerId:buyer.id,affId:up.id,level,base,pct:p,value:v});const a=A(up.id);a.earned+=v;a.byLevel[level]=(a.byLevel[level]||0)+v;if(level===1){a.sales+=base;a.salesN++}}
   cur=up.sponsorId;level++}});
 // tamanho da rede
 const netSize=id=>{let n=0;const q=[...(children.get(id)||[])];const seen=new Set();while(q.length){const x=q.shift();if(seen.has(x))continue;seen.add(x);n++;(children.get(x)||[]).forEach(c=>q.push(c))}return n};
 students.forEach(s=>{if(s.affiliate&&s.affiliate.status!=="none"||children.has(s.id)){const a=A(s.id);a.direct=(children.get(s.id)||[]).length;a.network=netSize(s.id)}});
 const paid=(S.db.payouts&&S.db.payouts.paid)||{};
 S.M={students,byId,orders,tickets,chats,st,buy,seg,children,ledger,aff,paid,prodById,
  ordersBy:(()=>{const m=new Map();orders.forEach(o=>{if(!m.has(o.studentId))m.set(o.studentId,[]);m.get(o.studentId).push(o)});return m})()};
 S.Mver=S.ver;return S.M}

 <defs><radialGradient id="sun" cx=".88" cy=".1" r=".35"><stop offset="0" stop-color="#FBBF24" stop-opacity=".55"/><stop offset="1" stop-color="#FBBF24" stop-opacity="0"/></radialGradient><linearGradient id="pg" x1="0" x2="1"><stop offset="0" stop-color="#D97706"/><stop offset="1" stop-color="#FBBF24"/></linearGradient></defs>
 <rect width="800" height="440" fill="url(#sun)"/>
 ${[[60,40],[140,90],[300,30],[380,70],[560,40],[620,150],[90,160],[250,120]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1.4" fill="#CBD5E1" opacity=".5"/>`).join("")}

 <g id="marks">${marks.map(([d,n])=>`<g data-mark="${d}" data-name="${esc(n)}" data-on="${st.count>=d?1:0}"></g>`).join("")}</g>

 </g><ellipse cy="1" rx="9" ry="2.6" fill="#000" opacity=".35"/></g>

function mountGame(){
 const svg=document.getElementById("gameSvg");if(!svg)return;const p=svg.querySelector("#trailPath"),done=svg.querySelector("#trailDone"),w=svg.querySelector("#walker");
 const L=p.getTotalLength(),count=+svg.dataset.count||0,at=f=>p.getPointAtLength(Math.max(0,Math.min(1,f))*L);
 svg.querySelectorAll("[data-mark]").forEach(g=>{const d=+g.dataset.mark,pt=at(d/90),on=g.dataset.on==="1";const up=pt.y>60;
  g.innerHTML=`<circle cx="${pt.x}" cy="${pt.y}" r="11" fill="${on?"#F59E0B":"#0F172A"}" stroke="${on?"#FBBF24":"#475569"}" stroke-width="2"/><text class="mnum" x="${pt.x}" y="${pt.y+4}" text-anchor="middle" style="fill:${on?"#020617":"#94A3B8"}">${d}</text><text class="mtxt" x="${pt.x}" y="${up?pt.y-18:pt.y+28}" text-anchor="middle">${esc(g.dataset.name)}</text>`});
 const end=at(1);svg.querySelector("#trophy").setAttribute("transform",`translate(${end.x+22} ${end.y-8})`);
 done.style.strokeDasharray=L;const target=count/90;
 const key="toro-walk-"+(S.imp||S.sess.id);let from=0;try{from=+sessionStorage.getItem(key);if(!(from>=0&&from<=1))from=0}catch(e){}
 if(from>target)from=0;
 const place=f=>{const q=at(f),q2=at(Math.min(1,f+.004));const flip=q2.x<q.x?-1:1;w.setAttribute("transform",`translate(${q.x} ${q.y}) scale(${flip*1.25} 1.25)`);done.style.strokeDashoffset=L*(1-f)};

function biData(){
 const M=model(),sn=since(),paidO=M.orders.filter(o=>PAID.has(o.status)),pO=paidO.filter(o=>odate(o)>=sn),t=today();
 const rev=sumBy(pO,o=>o.total),St=[...M.st.values()],N=M.students.length,game=M.students.filter(s=>M.buy.get(s.id).game).length;

 return{M,pO,rev,N,game,newS,earned,toPay:Math.max(0,allEarned-paidOut),
  active:St.filter(x=>x.activeToday).length,doneT:St.filter(x=>x.doneToday).length,risk:St.filter(x=>x.atRisk).length,fin:St.filter(x=>x.count>=90).length,
  affA:M.students.filter(s=>s.affiliate&&s.affiliate.status==="aprovado").length,affP:M.students.filter(s=>s.affiliate&&s.affiliate.status==="pendente").length,

function aFin(){

 const months=monthsBack(12),mm=Object.fromEntries(months.map(m=>[m,{id:m,rev:0,n:0,ref:0,com:0}]));M.orders.forEach(o=>{const k=odate(o).slice(0,7);if(!mm[k])return;if(PAID.has(o.status)){mm[k].rev+=o.total;mm[k].n++}else if(o.status==="reembolsado"||o.status==="cancelado")mm[k].ref+=o.total});M.ledger.forEach(l=>{const k=l.date.slice(0,7);if(mm[k])mm[k].com+=l.value});
 const k="a-fin-seg";let segRows=M.students;if(flt(k,"seg"))segRows=segRows.filter(s=>M.seg(s)===flt(k,"seg"));
 const SEG={game:"Só Game Toro",produtos:"Só produtos (sem Game)",ambos:"Game Toro + produtos",cadastro:"Só cadastro, sem compra"};
 const ord=id=>(M.ordersBy.get(id)||[]).filter(o=>PAID.has(o.status)).map(o=>odate(o)).sort();

 ${R("Loja, pedidos e financeiro",["Categorias: Game Toro, infoprodutos, cursos, mentorias, vestuário, acessórios, suplementos e bônus de conquista.",`Frete fixo de ${brl(c.freight)}, grátis acima de ${brl(c.freeFreightOver)}; endereço obrigatório para itens físicos.`,"Estoque baixa na compra e volta no cancelamento. Produto sem estoque aparece como esgotado.","Bônus de conquista liberam sozinhos no dia definido, sem compra.",`Financeiro estima o resultado com taxa de pagamento de ${c.gatewayFee}%, custo dos físicos e comissões.`])}

const pendingRead=new Set();
function markRead(id,field){const k=id+field;if(pendingRead.has(k)||S.imp)return;pendingRead.add(k);setTimeout(async()=>{try{await saveChat(id,{[field]:0})}catch(e){}pendingRead.delete(k)},0)}
function modalView(){
 if(!S.modal)return"";let inner="";
 if(S.modal.type==="buy")inner=buyModal();
 if(S.modal.type==="ticket-new")inner=ticketNewModal();
 if(S.modal.type==="order")inner=orderModal();
 if(S.modal.type==="pwreset"){const s=model().byId.get(S.modal.id);inner=`<div class="row"><h2>Redefinir senha</h2><button class="x" data-a="modal-close" aria-label="Fechar">×</button></div><p class="muted small" style="margin-top:8px">${esc(s?s.name:"")} · ${esc(s?s.email:"")}</p><label class="f" style="margin-top:14px">Nova senha (mín. 8, com letra e número)<input type="password" data-f="rp_pass" autocomplete="new-password"></label><button class="btn gold block" style="margin-top:14px" data-a="pw-reset-save">Salvar nova senha</button>`}
 return inner?`<div class="modal" data-a="modal-bg"><div class="mbox" role="dialog" aria-modal="true">${inner}</div></div>`:""}
function viewHtml(){
 const ready=S.loaded.accounts&&S.loaded.products&&S.loaded.config;
 if(!ready)return `<main class="wrap"><div class="panel empty"><p class="muted">Carregando o sistema…</p></div></main>`;
 if(S.sess&&!S.sess.test){const a=account();if(!a||a.active===false){S.sess=null;saveSess();S.view="login"}}
 if(S.sess&&S.sess.test&&!model().byId.has(S.sess.id)){S.sess=null;saveSess();S.view="login"}
 if(S.view==="site")return siteView();
 if(!S.sess)return loginView();
 if(S.view==="admin"&&S.sess.role==="admin")return adminView();
 if(S.view==="student"&&(S.sess.role==="student"||(S.imp&&can("veraluno"))))return studentView();
 S.view=S.sess.role==="admin"?"admin":"student";return S.view==="admin"?adminView():studentView()}
let rq=false;
function render(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;doRender()})}
function doRender(){
 const a=document.activeElement,key=a&&a.dataset&&(a.dataset.f||a.dataset.tq||a.dataset.lv||a.dataset.l);let ss=null,se=null;try{ss=a.selectionStart;se=a.selectionEnd}catch(e){}
 const box=document.getElementById("chatbox"),atBottom=!box||box.scrollHeight-box.scrollTop-box.clientHeight<40;
 $("#app").innerHTML=header()+viewHtml()+modalView();
 if(key){const el=document.querySelector(`[data-f="${key}"],[data-tq="${key}"],[data-lv="${key}"],[data-l="${key}"]`);if(el){el.focus({preventScroll:true});try{if(ss!=null)el.setSelectionRange(ss,se)}catch(e){}}}
 const nb=document.getElementById("chatbox");if(nb&&atBottom)nb.scrollTop=nb.scrollHeight;
 mountGame();S.celebrate=false}

/* ================= Ações do aluno ================= */
async function setItem(k,val){
 if(readOnly())return;const me=ME(),st=stats(me);if(!st.started||st.doneToday||st.count>=90)return;
 const base=me.today&&me.today.date===today()?(me.today.tasks||{}):{},tasks=Object.fromEntries(ITEMS.map(x=>[x,!!base[x]]));tasks[k]=val;
 const patch={today:{date:today(),tasks}};let done=false;
 if(ITEMS.every(x=>tasks[x])){patch.doneDates=[...(me.doneDates||[]),today()];done=true;S.celebrate=true}
 const ok=await write(()=>saveStudent(me.id,patch),done?"Dia concluído. Mais uma estrela!":null);
 if(ok&&done&&stats({...me,doneDates:patch.doneDates}).count===(+S.config.affiliateDays||21))setTimeout(()=>toast("Você completou os dias de metas: já pode virar Afiliado Júnior!"),1500)}
async function saveConfig(patch){return S.configExists?store.update("config/app",patch):store.set("config/app",merge(S.config,patch))}

 "les-add":()=>{S.draft.lessons=[...(S.draft.lessons||[]),{t:"",d:"",u:"",v:""}];render()},
 "les-del":el=>{S.draft.lessons.splice(+el.dataset.i,1);render()},
 "prod-save":async()=>{const d=S.draft;if(!String(d.name).trim()){toast("Dê um nome ao produto.");return}if(d.category!=="bonus"&&!(+d.price>=0)){toast("Informe o preço.");return}
  const id=d.id||("p-"+Date.now().toString(36)),phys=PHYS.has(d.category);
  const doc={name:d.name.trim(),category:d.category,sku:String(d.sku||"").trim(),price:Math.max(0,+d.price||0),cost:Math.max(0,+d.cost||0),stock:phys&&String(d.stock).trim()!==""?Math.max(0,Math.floor(+d.stock)):"",variants:phys?String(d.variants||"").split(",").map(x=>x.trim()).filter(Boolean).join(", "):"",description:String(d.description||"").trim(),imageId:d.imageId||"",checkoutUrl:safeUrl(String(d.checkoutUrl||"").trim()),accessUrl:safeUrl(String(d.accessUrl||"").trim()),fileId:d.fileId||"",fileIdType:d.fileIdType||"",bonusDay:d.category==="bonus"?+d.bonusDay||21:0,active:!!d.active,commissionable:d.category!=="bonus"&&!!d.commissionable,order:+d.order||0,
   lessons:LESSON_CATS.has(d.category)?(d.lessons||[]).filter(l=>String(l.t||"").trim()).map(l=>({t:String(l.t).trim(),d:String(l.d||"").trim(),u:safeUrl(String(l.u||"").trim()),v:l.v||""})):[],updatedAt:nowISO()};
  if(await write(()=>store.set("products/"+id,doc),d.id?"Produto salvo.":"Produto cadastrado.")){S.editProduct=null;S.draft={};render()}},
 "prod-del":async()=>{if(!confirm("Excluir este produto? Pedidos antigos continuam no histórico."))return;if(await write(()=>store.del("products/"+S.draft.id),"Produto excluído.")){S.editProduct=null;S.draft={};render()}},
 ord:el=>{S.modal={type:"order",id:el.dataset.id};delete S.draft.o_st;delete S.draft.o_tr;render()},
 "ord-save":async()=>{const o=model().orders.find(x=>x.id===S.modal.id);if(!o)return;const ns=S.draft.o_st||o.status,tr=String(S.draft.o_tr??o.tracking??"").trim();
  const patch={status:ns,tracking:tr};if(PAID.has(ns)&&!o.paidAt)patch.paidAt=today();
  const ok=await write(async()=>{await saveOrder(o.id,patch);
   if((ns==="cancelado"||ns==="reembolsado")&&PAID.has(o.status)&&!o.test)for(const it of o.items){const p=S.db.products.find(x=>x.id===it.productId);if(p&&PHYS.has(p.category)&&p.stock!==""&&p.stock!=null)await store.update("products/"+p.id,{stock:+p.stock+it.qty})}},"Pedido atualizado.");
  if(ok){S.modal=null;render()}},
 "seg-go":el=>{FL["a-fin-seg"]={seg:el.dataset.v};tstate("a-fin-seg").page=1;render();setTimeout(()=>{const t=document.querySelector('[data-flt="a-fin-seg:seg"]');if(t)t.scrollIntoView({behavior:"smooth",block:"center"})},80)},
 "risk-go":()=>{S.atab="alunos";S.selStudent=null;FL["a-alunos"]={sit:"risco"};tstate("a-alunos").page=1;window.scrollTo(0,0);render()},
 "lv-range":()=>{const d=S.draft,a=Math.max(1,+d.rgA||0),b=Math.min(100,+d.rgB||0),p=+d.rgP;if(!(a<=b)||!(p>=0&&p<=100)){toast("Informe uma faixa válida de níveis e o percentual.");return}for(let i=a;i<=b;i++)d.lv[i-1]=String(p);render()},
 "lv-zero":()=>{if(!confirm("Zerar o percentual de todos os 100 níveis?"))return;S.draft.lv=Array(100).fill("0");render()},
 "lv-page":el=>{S.lvlPage=+el.dataset.p;render()},
 "lv-save":async()=>{const d=S.draft,lv=d.lv.map(v=>Math.max(0,Math.min(100,Math.round((+v||0)*100)/100))),tot=lv.reduce((a,b)=>a+b,0),max=Math.max(0,Math.min(100,+d.lvMax||0)),days=Math.max(1,Math.min(90,Math.floor(+d.lvDays||21)));
  if(tot>max){toast(`A soma (${Math.round(tot*100)/100}%) passa do teto de ${max}%.`);return}
  await write(()=>saveConfig({levels:lv,maxTotal:max,affiliateDays:days,autoApprove:!!d.lvAuto}),"Regras de comissão salvas.")},
 "chat-open":el=>{S.selChat=el.dataset.id;delete S.draft.achat_txt;render()},
 "achat-send":async()=>{const txt=String(S.draft.achat_txt||"").trim(),id=S.selChat;if(!txt||!id)return;const c=model().chats.find(x=>x.id===id);
  const msgs=[...((c&&c.messages)||[]),{f:"s",by:(account()||{}).name||"Equipe Toro",t:txt.slice(0,2000),at:nowISO()}].slice(-300);S.draft.achat_txt="";
  await write(()=>saveChat(id,{studentId:id,messages:msgs,unreadStudent:((c&&c.unreadStudent)||0)+1,unreadAdmin:0,updatedAt:nowISO()}))},
 "user-new":()=>{openUser(null);render()},
 "user-edit":el=>{openUser(el.dataset.id);window.scrollTo(0,0);render()},
 "user-cancel":()=>{S.editUser=null;S.draft={};render()},
 "pm-all":()=>{PERMS.forEach(p=>S.draft["pm_"+p[0]]=true);render()},
 "pm-none":()=>{PERMS.forEach(p=>S.draft["pm_"+p[0]]=false);render()},
 "user-save":async()=>{const d=S.draft,me=account(),email=String(d.email||"").trim().toLowerCase(),isNew=S.editUser==="new";
  const perms=PERMS.map(p=>p[0]).filter(p=>d["pm_"+p]);
  if(String(d.name||"").trim().length<3){toast("Informe o nome.");return}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast("E-mail inválido.");return}
  if(S.db.accounts.some(a=>a.email.toLowerCase()===email&&a.id!==d.id)){toast("Já existe uma conta com este e-mail.");return}
  const p=String(d.pass||"");if((isNew||p)&&(p.length<8||!/[a-z]/i.test(p)||!/\d/.test(p))){toast("A senha precisa de 8 caracteres, com letras e números.");return}
  if(!perms.length){toast("Marque ao menos um módulo.");return}
  if(d.id===me.id&&(!perms.includes("usuarios")||!d.active)){toast("Você não pode tirar o próprio acesso a Usuários nem se desativar.");return}
  const others=S.db.accounts.filter(a=>a.id!==d.id&&a.role==="admin"&&a.active!==false&&isFullAdmin(a)).length;
  if(!others&&!(d.active&&perms.includes("usuarios")&&perms.includes("config"))){toast("Precisa existir ao menos um administrador geral ativo.");return}
  const id=d.id||uid("adm-"),doc={name:d.name.trim(),email,title:String(d.title||"").trim(),role:"admin",perms,active:!!d.active};
  if(p){doc.salt=newSalt();doc.hash=await hashPass(doc.salt,p)}
  if(await write(()=>isNew?store.set("accounts/"+id,{...doc,createdAt:nowISO()}):store.update("accounts/"+id,doc),isNew?"Usuário criado.":"Usuário atualizado.")){S.editUser=null;S.draft={};render()}},
 "cfg-save":async()=>{const d=S.draft;await write(()=>saveConfig({photoId:d.photoId||"",instagram:safeUrl(String(d.instagram||"").trim()),welcome:d.welcome,defaultTasks:Object.fromEntries(AREAS.map(a=>[a.k,String(d["task_"+a.k]||"").trim()])),webinarAt:d.webinarAt||"",webinarUrl:safeUrl(String(d.webinarUrl||"").trim()),checkoutBase:safeUrl(String(d.checkoutBase||"").trim()),freight:Math.max(0,+d.freight||0),freeFreightOver:Math.max(0,+d.freeFreightOver||0),gatewayFee:Math.max(0,Math.min(30,+d.gatewayFee||0)),showTestBase:!!d.showTestBase}),"Configurações salvas.")}
};

/* ================= Eventos ================= */
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;const f=A[el.dataset.a];if(!f)return;
 if(el.dataset.a==="modal-bg"){if(e.target===el)f(el,e);return}e.preventDefault();f(el,e)});
document.addEventListener("keydown",e=>{const el=e.target;
 if(e.key==="Enter"&&el.matches&&el.matches("tr[data-a]")){const f=A[el.dataset.a];if(f)f(el);return}
 if(e.key==="Enter"&&el.dataset&&el.dataset.enter&&!(el.tagName==="TEXTAREA"&&e.shiftKey)){e.preventDefault();const f=A[el.dataset.enter];if(f)f(el)}
 if(e.key==="Escape"&&S.modal){S.modal=null;render()}});
document.addEventListener("input",e=>{const el=e.target;
 if(el.dataset.f){S.draft[el.dataset.f]=el.type==="checkbox"?el.checked:el.value;if(el.type==="range"){const o=el.parentElement.querySelector("output");if(o)o.textContent=el.value}if(el.dataset.rer)render()}
 if(el.dataset.tq){const t=tstate(el.dataset.tq);t.q=el.value;t.page=1;render()}
 if(el.dataset.lv)S.draft.lv[+el.dataset.lv]=el.value;
 if(el.dataset.l){const[i,k]=el.dataset.l.split(":");if(S.draft.lessons&&S.draft.lessons[+i])S.draft.lessons[+i][k]=el.value}});
document.addEventListener("change",async e=>{const el=e.target;
 if(el.dataset.f&&(el.tagName==="SELECT"||el.type==="checkbox")){S.draft[el.dataset.f]=el.type==="checkbox"?el.checked:el.value;if(el.dataset.rer||el.closest(".perm"))render()}
 if(el.dataset.lv)render();
 if(el.dataset.flt){const[k,f]=el.dataset.flt.split(":");FL[k]=FL[k]||{};FL[k][f]=el.value;tstate(k).page=1;render()}
 if(el.dataset.tsize){const t=tstate(el.dataset.tsize);t.size=+el.value;t.page=1;render()}
 if(el.dataset.a2==="biper"){S.biPeriod=el.value;render()}
 if(el.dataset.a2==="tk-status")write(()=>saveTicket(S.selTicket,{status:el.value,updatedAt:nowISO()}),"Status atualizado.");
 if(el.dataset.a2==="tk-assign")write(()=>saveTicket(S.selTicket,{assignee:el.value,updatedAt:nowISO()}),"Responsável definido.");
 if(el.dataset.up){const file=el.files&&el.files[0];if(!file||!S.assets)return;if(file.size>20*1024*1024){toast("Arquivo acima de 20 MB. Para vídeos longos, use um link do Bunny ou Vimeo.");el.value="";return}
  const key=el.dataset.up;S.uploading=key.startsWith("les:")?"les"+key.slice(4):key;render();
  try{const r=await S.assets.upload(file);if(key.startsWith("les:")){const i=+key.slice(4);if(S.draft.lessons&&S.draft.lessons[i])S.draft.lessons[i].v=r.id}else{S.draft[key]=r.id;S.draft[key+"Type"]=r.contentType||file.type}toast("Arquivo enviado. Salve para publicar.")}
  catch(err){toast(err&&err.code==="quota_exceeded"?"Espaço de armazenamento esgotado.":"Falha no envio. Confira o formato e tente de novo.")}
  S.uploading=null;render()}});
document.addEventListener("contextmenu",e=>{if(e.target.tagName==="VIDEO")e.preventDefault()});

/* ================= Inicialização ================= */
(async function boot(){
 const[db,assets]=await Promise.all([use("db"),use("assets")]);
 S.assets=assets;if(db){store=dbStore(db);S.live=true}else{store=localStore();S.live=false}
 ["alunos","accounts","products","content","orders","tickets","chats"].forEach(col=>store.watchCol(col,l=>{S.db[col]=l;S.loaded[col]=true;bump();render()}));
 store.watchDoc("config/app",d=>{const c=d||{};S.configExists=!!d;const lv=Array.isArray(c.levels)?c.levels.slice(0,100):DEF_LEVELS.slice();while(lv.length<100)lv.push(0);
  S.config={...DEFAULT_CONFIG,...c,levels:lv,defaultTasks:{...DEFAULT_CONFIG.defaultTasks,...(c.defaultTasks||{})}};S.loaded.config=true;bump();render()});
 store.watchDoc("payouts/all",d=>{S.db.payouts=d;bump();render()});
 try{const ref=new URLSearchParams(location.search).get("ref");if(ref){S.draft.su_ref=ref.toUpperCase();S.loginTab="cadastro"}}catch(e){}
 const sess=loadSess();if(sess&&sess.id){S.sess=sess;S.view=sess.role==="admin"?"admin":"student";if(S.view==="admin")S.atab="bi"}
 render();
})();

</script>
